subject: "Bienvenue sur AdhereOne !"
body: |
  <img src="${ciso_assistant_url}/adhereone-logo.png" alt="AdhereOne" width="200">

  ## Bienvenue sur AdhereOne !

  **Votre plateforme de gestion GRC tout-en-un**

  Un accès à AdhereOne vous a été accordé. Pour commencer, utilisez le lien ci-dessous pour définir votre mot de passe :

  [Définir mon mot de passe](${set_password_url})

  En cas de problème avec le lien, copiez et collez l'URL suivante dans votre navigateur :
  ${set_password_url}

  Ce lien ne peut être utilisé qu'une seule fois. S'il a expiré, rendez-vous sur [votre instance](${ciso_assistant_url}) et demandez une réinitialisation de mot de passe.

  Si vous, ou votre organisation, n'avez pas fait cette demande, vous pouvez simplement ignorer cet email.

  En savoir plus sur AdhereOne [ici](https://www.adheresystems.com).

  Besoin d'aide ? Contactez [support@adheresystems.com](mailto:support@adheresystems.com).

  Cordialement,
  L'équipe AdhereOne
