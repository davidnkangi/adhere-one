subject: "Bienvenue sur AdhereOne !"
body: |
  <img src="${ciso_assistant_url}/adhereone-logo.png" alt="AdhereOne" width="200">

  ## Bienvenue sur AdhereOne !

  **Votre plateforme de gestion GRC tout-en-un**

  Un accès à AdhereOne vous a été accordé. Pour commencer, connectez-vous via le lien ci-dessous en utilisant l'authentification SSO :

  [Se connecter à AdhereOne](${ciso_assistant_url})

  En cas de problème avec le lien, copiez et collez l'URL suivante dans votre navigateur :
  ${ciso_assistant_url}

  Si vous, ou votre organisation, n'avez pas fait cette demande, vous pouvez simplement ignorer cet email.

  En savoir plus sur AdhereOne [ici](https://www.consultadhere.com/).

  Cordialement,
  L'équipe AdhereOne
