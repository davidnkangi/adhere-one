subject: "AdhereOne: Evidence expired since ${expired_since} day(s)"
body: |
  Hello,

  You have ${evidence_count} evidence(s) expired since ${expired_since} day(s):

  ${evidence_list}

  Please log in to your AdhereOne portal to review and update these evidences: [Go to AdhereOne](${ciso_assistant_url})

  Thank you.
