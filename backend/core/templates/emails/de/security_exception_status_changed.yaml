subject: "AdhereOne: Ausnahme '${exception_name}' hat jetzt den Status ${new_status}"
body: |
  Hallo,

  Der Status der folgenden Ausnahme wurde geändert:

  - Name: ${exception_name}
  - Referenz-ID: ${exception_ref_id}
  - Neuer Status: ${new_status}
  - Aktualisiert von: ${actor_name}
  - Bereich: ${folder_name}

  Melden Sie sich in Ihrem AdhereOne-Portal an, um diese Ausnahme anzuzeigen: [AdhereOne öffnen](${ciso_assistant_url})

  Vielen Dank.
