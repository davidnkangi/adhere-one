name: AdhereOne images

# Builds the backend and frontend images from this repository and pushes them to GHCR.
# Render pulls them (see render.yaml). Upstream's own image workflows are not used.
on:
  push:
    branches: [adhere/main, adhere/rebrand]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/davidnkangi/adhere-one/${{ matrix.component }}:${{ github.sha }}
            ghcr.io/davidnkangi/adhere-one/${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Optional: set these repository secrets (Render service > Settings > Deploy Hook) to redeploy automatically.
      - name: Trigger Render deploys
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          for hook in "$HOOK_BACKEND" "$HOOK_FRONTEND"; do
            if [ -n "$hook" ]; then curl -fsS -X POST "$hook" >/dev/null && echo "deploy triggered"; fi
          done
