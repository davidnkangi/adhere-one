subject: "AdhereOne: Dérogation de sécurité expirant dans ${days_remaining} jour(s)"
body: |
  Bonjour,

  Vous avez ${exception_count} dérogation(s) de sécurité expirant dans ${days_remaining} jour(s) :

  ${exception_list}

  Connectez-vous à votre portail AdhereOne pour consulter et mettre à jour ces dérogations de sécurité : [Accéder à AdhereOne](${ciso_assistant_url})

  Merci.
