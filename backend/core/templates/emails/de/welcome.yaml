subject: "Willkommen bei AdhereOne!"
body: |
  <img src="${ciso_assistant_url}/adhereone-logo.png" alt="AdhereOne" width="200">

  ## Willkommen bei AdhereOne!

  **Ihre zentrale GRC-Managementplattform**

  Sie haben Zugriff auf AdhereOne erhalten. Legen Sie zum Einstieg über den folgenden Link Ihr Passwort fest:

  [Passwort festlegen](${set_password_url})

  Falls der Link nicht funktioniert, kopieren Sie die folgende Adresse in Ihren Browser:
  ${set_password_url}

  Dieser Link kann nur einmal verwendet werden. Falls er abgelaufen ist, öffnen Sie [Ihre Instanz](${ciso_assistant_url}) und fordern Sie das Zurücksetzen des Passworts an.

  Falls weder Sie noch Ihre Organisation diese Anfrage gestellt haben, können Sie diese E-Mail ignorieren.

  Weitere Informationen über AdhereOne finden Sie [hier](https://www.consultadhere.com/).

  Freundliche Grüße
  Ihr AdhereOne-Team
